<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Gym logo">
  <defs>
    <linearGradient id="gymRing" x1="12" y1="12" x2="108" y2="108" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="gymMetal" x1="20" y1="48" x2="100" y2="72" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#CBD5E1"/>
      <stop offset="1" stop-color="#94A3B8"/>
    </linearGradient>
    <linearGradient id="gymAccent" x1="40" y1="30" x2="80" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <circle cx="60" cy="60" r="52" fill="url(#gymRing)" opacity="0.18"/>
  <circle cx="60" cy="60" r="46" stroke="url(#gymRing)" stroke-width="3" opacity="0.9"/>

  <!-- Left plates -->
  <rect x="18" y="42" width="12" height="36" rx="4" fill="url(#gymMetal)"/>
  <rect x="28" y="46" width="8" height="28" rx="3" fill="url(#gymAccent)"/>

  <!-- Bar -->
  <rect x="34" y="55" width="52" height="10" rx="5" fill="url(#gymMetal)"/>

  <!-- Right plates -->
  <rect x="84" y="46" width="8" height="28" rx="3" fill="url(#gymAccent)"/>
  <rect x="90" y="42" width="12" height="36" rx="4" fill="url(#gymMetal)"/>

  <!-- Center grip detail -->
  <circle cx="60" cy="60" r="5" fill="#0B1220"/>
  <circle cx="60" cy="60" r="2.5" fill="#34D399"/>
</svg>
